<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solara Bay 3D</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
    background: #0b1020; font-family: 'Segoe UI', Arial, sans-serif; color: #fff; }
  #app { position: fixed; inset: 0; }
  canvas.game { display: block; }
  .panel { position: absolute; pointer-events: none; text-shadow: 0 1px 3px rgba(0,0,0,.8); }
  #stats { top: 12px; left: 14px; font-size: 15px; line-height: 1.5; }
  #healthbar { width: 170px; height: 12px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.5); border-radius: 6px; overflow: hidden; margin-top: 4px; }
  #healthfill { height: 100%; width: 100%; background: linear-gradient(90deg,#37d67a,#a5e34d); }
  #stars { top: 12px; right: 16px; font-size: 26px; letter-spacing: 3px; color: #ffd23e; }
  #mission { left: 50%; transform: translateX(-50%); bottom: 18px; width: 560px; max-width: 80vw;
    text-align: center; background: rgba(0,0,0,.45); border-radius: 8px; padding: 8px 12px; }
  #missionTitle { font-size: 17px; font-weight: 700; color: #ffd23e; }
  #missionObj { font-size: 14px; color: #e8e8e8; margin-top: 2px; }
  #speedo { right: 16px; bottom: 16px; text-align: right; font-size: 15px; line-height: 1.5; }
  #speedo b { font-size: 26px; }
  #crosshair { left: 50%; top: 50%; transform: translate(-50%,-50%); font-size: 22px;
    color: rgba(255,255,255,.9); display: none; }
  #banner { left: 50%; top: 22%; transform: translateX(-50%); font-size: 26px; font-weight: 700;
    color: #ffd23e; text-align: center; opacity: 0; transition: opacity .4s; white-space: nowrap; }
  #minimapWrap { left: 14px; bottom: 14px; width: 168px; height: 168px; }
  #minimap { width: 168px; height: 168px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,.55); background: rgba(0,0,0,.4); }
  #hint { right: 16px; top: 56px; font-size: 12px; color: #cfd6e4; text-align: right; line-height: 1.6; }
  #title { left: 50%; top: 8px; transform: translateX(-50%); font-size: 15px; letter-spacing: 2px;
    color: rgba(255,255,255,.75); }
  #pause { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(0,0,0,.6); z-index: 10; }
  #pause .box { background: #141a2e; border: 1px solid #3a4568; border-radius: 12px;
    padding: 26px 34px; text-align: center; }
  #pause h2 { margin: 0 0 6px; color: #ffd23e; }
  #pause p { margin: 4px 0 16px; color: #cfd6e4; font-size: 14px; }
  #pause button { pointer-events: auto; margin: 4px; padding: 10px 18px; font-size: 15px;
    border-radius: 8px; border: none; background: #ffd23e; color: #222; cursor: pointer; font-weight: 700; }
  #pause button.ghost { background: #2a3352; color: #fff; }
  #selftest { position: absolute; left: 8px; top: 8px; z-index: 20; font: 13px monospace;
    background: rgba(0,0,0,.75); color: #8f8; padding: 8px 10px; border-radius: 6px;
    display: none; white-space: pre; }
</style>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
</head>
<body>
<div id="app"></div>
<div id="title" class="panel">SOLARA BAY</div>
<div id="stats" class="panel">
  <div>💵 $<span id="money">0</span> &nbsp; 🔫 <span id="ammo">12</span></div>
  <div id="healthbar"><div id="healthfill"></div></div>
  <div style="font-size:12px;color:#cfd6e4">Mara Voss &middot; Solara Bay</div>
</div>
<div id="stars" class="panel">☆☆☆☆☆</div>
<div id="hint" class="panel">WASD move / drive &middot; E enter car &middot; Click shoot<br>R reload &middot; Shift sprint &middot; Esc pause &middot; drag mouse to look</div>
<div id="mission" class="panel">
  <div id="missionTitle">First Job</div>
  <div id="missionObj">Head to the docks.</div>
</div>
<div id="speedo" class="panel"><b id="speed">0</b> km/h<br><span id="veh">On foot</span></div>
<div id="crosshair" class="panel">+</div>
<div id="banner" class="panel"></div>
<div id="minimapWrap" class="panel"><canvas id="minimap" width="168" height="168"></canvas></div>
<div id="pause"><div class="box">
  <h2>Paused</h2>
  <p>Solara Bay &middot; Mara Voss is waiting.</p>
  <button id="resumeBtn">Resume</button>
  <button id="saveBtn" class="ghost">Save game</button>
  <button id="quitBtn" class="ghost">Save &amp; reload</button>
</div></div>
<div id="selftest"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
